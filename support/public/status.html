<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status — Todoer</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    .support-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      height: 52px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      gap: 16px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }

    .topbar-brand img { width: 22px; height: 22px; }

    .topbar-brand-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }

    .topbar-divider { width: 1px; height: 14px; background: var(--border-light); }
    .topbar-sub { font-size: 13px; color: var(--text-2); }

    .topbar-right { display: flex; align-items: center; gap: 4px; }

    .topbar-right a {
      font-size: 12.5px; color: var(--text-2);
      padding: 5px 10px; border-radius: var(--radius-sm);
      text-decoration: none; transition: color 0.15s, background 0.15s;
    }

    .topbar-right a:hover { color: var(--text-1); background: var(--surface-2); }

    /* ── Page ── */
    .status-page {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding: 52px 28px 72px;
    }

    /* ── Overall banner ── */
    .overall-banner {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      border-radius: var(--radius-lg);
      margin-bottom: 40px;
    }

    .overall-banner.operational {
      background: rgba(34,197,94,0.07);
      border: 1px solid rgba(34,197,94,0.2);
    }

    .overall-banner.degraded {
      background: rgba(245,158,11,0.07);
      border: 1px solid rgba(245,158,11,0.2);
    }

    .overall-banner.outage {
      background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.2);
    }

    .overall-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .overall-banner.operational .overall-icon {
      background: rgba(34,197,94,0.12);
      color: #22c55e;
    }

    .overall-text h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-1);
      letter-spacing: -0.02em;
      margin-bottom: 3px;
    }

    .overall-text p { font-size: 13px; color: var(--text-2); line-height: 1.4; }

    .overall-updated {
      margin-left: auto;
      font-size: 11.5px;
      color: var(--text-3);
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Section ── */
    .status-section { margin-bottom: 36px; }

    .status-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Component row ── */
    .component-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .component-row:last-child { border-bottom: none; }

    .component-name {
      flex: 1;
      font-size: 13.5px;
      color: var(--text-1);
      font-weight: 500;
    }

    .component-desc {
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .component-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .status-dot-sm {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot-sm.operational  { background: #22c55e; }
    .status-dot-sm.degraded     { background: #f59e0b; }
    .status-dot-sm.outage       { background: #ef4444; }
    .status-dot-sm.maintenance  { background: #6366f1; }

    .status-label.operational  { color: #22c55e; }
    .status-label.degraded     { color: #f59e0b; }
    .status-label.outage       { color: #ef4444; }
    .status-label.maintenance  { color: #6366f1; }

    /* ── Uptime bars ── */
    .uptime-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .uptime-bars {
      display: flex;
      gap: 2px;
      align-items: flex-end;
    }

    .uptime-bar {
      width: 4px;
      border-radius: 2px;
      background: #22c55e;
      opacity: 0.7;
      height: 16px;
      transition: height 0.2s;
    }

    .uptime-bar.degraded { background: #f59e0b; height: 10px; }
    .uptime-bar.outage   { background: #ef4444; height: 6px; }

    .uptime-pct {
      font-size: 11px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ── Incident history ── */
    .incident-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .incident-item:last-child { border-bottom: none; }

    .incident-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .incident-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-1);
    }

    .incident-date {
      font-size: 11.5px;
      color: var(--text-3);
      flex-shrink: 0;
    }

    .incident-badge {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }

    .incident-badge.resolved {
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.2);
      color: #22c55e;
    }

    .incident-update {
      font-size: 12.5px;
      color: var(--text-2);
      line-height: 1.55;
    }

    .incident-updates { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }

    .incident-update-row {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }

    .incident-update-time {
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Subscribe strip ── */
    .subscribe-strip {
      padding: 20px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .subscribe-strip p {
      font-size: 13px;
      color: var(--text-2);
    }

    .subscribe-strip p strong { color: var(--text-1); font-weight: 500; }

    /* ── Footer ── */
    .support-footer { border-top: 1px solid var(--border); }

    .footer-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-3);
    }

    .footer-brand img { width: 16px; height: 16px; opacity: 0.5; }

    .footer-links { display: flex; gap: 16px; }

    .footer-links a {
      font-size: 12px;
      color: var(--text-3);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-links a:hover { color: var(--text-2); }

    @media (max-width: 600px) {
      .topbar { padding: 0 16px; }
      .status-page { padding: 32px 16px 60px; }
      .overall-banner { flex-wrap: wrap; }
      .overall-updated { margin-left: 0; text-align: left; }
      .uptime-bars { display: none; }
    }
  </style>
</head>
<body>
<div class="support-layout">

  <header class="topbar">
    <a href="/" class="topbar-brand">
      <img src="/assets/logo.svg" alt="Todoer">
      <span class="topbar-brand-text">Todoer</span>
      <span class="topbar-divider"></span>
      <span class="topbar-sub">Status</span>
    </a>
    <div class="topbar-right">
      <a href="/">Help Center</a>
      <a href="/chat">Support</a>
      <a href="__APP_URL__" target="_blank" rel="noopener">Back to app</a>
    </div>
  </header>

  <main class="status-page">

    <div class="overall-banner operational" id="overallBanner">
      <div class="overall-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="overall-text">
        <h2 id="overallTitle">All systems operational</h2>
        <p id="overallSub">No incidents or outages detected.</p>
      </div>
      <div class="overall-updated" id="updatedAt">
        Updated just now
      </div>
    </div>

    <div class="status-section">
      <div class="status-section-title">Services</div>
      <div id="componentsList"></div>
    </div>

    <div class="status-section">
      <div class="status-section-title">Incident History — Past 30 days</div>
      <div id="incidentsList"></div>
    </div>

    <div class="subscribe-strip">
      <form id="subscribeForm" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;width:100%;">
        <p style="margin-right:auto;"><strong>Stay informed.</strong> Subscribe for incident notifications and maintenance windows.</p>
        <input type="email" id="subEmail" placeholder="you@example.com" autocomplete="email" style="flex:1;min-width:180px;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text-1);font-size:13px;">
        <input type="url" id="subWebhook" placeholder="https://your-webhook.example (optional)" autocomplete="off" spellcheck="false" style="flex:1;min-width:220px;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text-1);font-size:13px;">
        <button type="submit" class="btn btn-secondary" style="padding:9px 16px;">Subscribe</button>
        <div id="subResult" style="width:100%;font-size:12.5px;color:var(--text-2);"></div>
      </form>
    </div>

  </main>

  <footer class="support-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="/assets/logo.svg" alt="">
        <span>© 2026 Todoer</span>
      </div>
      <nav class="footer-links">
        <a href="/">Help Center</a>
        <a href="/chat">Support</a>
        <a href="__APP_URL__" target="_blank" rel="noopener">Back to app</a>
      </nav>
    </div>
  </footer>

</div>

<script>
  function esc(s) {
    const d = document.createElement('div');
    d.textContent = String(s == null ? '' : s);
    return d.innerHTML;
  }

  function fmtLatency(ms) {
    if (ms == null) return '—';
    return ms + ' ms';
  }

  function fmtDate(s) {
    if (!s) return '—';
    return new Date(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderBars() {
    let html = '';
    for (let i = 0; i < 30; i++) html += '<div class="uptime-bar"></div>';
    return html;
  }

  function statusLabel(status) {
    const labels = { operational: 'Operational', degraded: 'Degraded', outage: 'Outage' };
    return labels[status] || status;
  }

  function renderStatus(data) {
    const components = data.components || [];

    const anyOutage  = components.some(c => c.status === 'outage');
    const anyDegraded = components.some(c => c.status === 'degraded');
    const banner = document.getElementById('overallBanner');
    banner.className = 'overall-banner ' + (anyOutage ? 'outage' : anyDegraded ? 'degraded' : 'operational');
    document.getElementById('overallTitle').textContent = anyOutage
      ? 'Partial system outage'
      : anyDegraded
        ? 'Degraded performance'
        : 'All systems operational';
    document.getElementById('overallSub').textContent = anyOutage
      ? 'One or more services are currently unavailable.'
      : anyDegraded
        ? 'One or more services are experiencing slower than normal response times.'
        : 'No incidents or outages detected.';
    document.getElementById('updatedAt').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const list = document.getElementById('componentsList');
    list.innerHTML = components.map(c => `
      <div class="component-row">
        <div>
          <div class="component-name">${esc(c.name)}</div>
          <div class="component-desc">${esc(c.description || '')}</div>
        </div>
        <div class="uptime-wrap">
          <div class="uptime-bars">${renderBars()}</div>
          <span class="uptime-pct">${fmtLatency(c.latency_ms)}</span>
        </div>
        <div class="component-status">
          <span class="status-dot-sm ${esc(c.status)}"></span>
          <span class="status-label ${esc(c.status)}">${statusLabel(c.status)}</span>
        </div>
      </div>`).join('') || '<div class="component-row" style="color:var(--text-3);font-size:13px;">No components configured.</div>';

    const incidents = data.incidents || [];
    const incList = document.getElementById('incidentsList');
    if (!incidents.length) {
      incList.innerHTML = '<div style="padding:16px 0;font-size:13px;color:var(--text-3);">No incidents in the last 30 days.</div>';
      return;
    }
    incList.innerHTML = incidents.map(i => `
      <div class="incident-item">
        <div class="incident-header">
          <span class="incident-title">${esc(i.title)}</span>
          <span class="incident-date">${fmtDate(i.created_at)}</span>
        </div>
        <span class="incident-badge ${esc(i.badge)}">${esc(i.badge)}</span>
        <div class="incident-updates">
          ${(i.updates || []).map(u => `
            <div class="incident-update-row">
              <span class="incident-update-time">${esc(u.time_label || '')}</span>
              <span class="incident-update">${esc(u.content)}</span>
            </div>`).join('')}
        </div>
      </div>`).join('');
  }

  async function loadStatus() {
    try {
      const r = await fetch('/api/status');
      if (r.ok) renderStatus(await r.json());
    } catch {}
  }

  // ── Subscribe ──
  document.getElementById('subscribeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const result = document.getElementById('subResult');
    const email = document.getElementById('subEmail').value.trim();
    const webhookUrl = document.getElementById('subWebhook').value.trim();
    result.textContent = 'Subscribing…';

    try {
      const r = await fetch('/api/status/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email || undefined, webhook_url: webhookUrl || undefined })
      });
      const d = await r.json();
      if (r.ok) {
        result.style.color = 'var(--text-2)';
        result.textContent = d.verified
          ? `Subscribed — webhook verified (received ${d.status_code} in ${d.latency_ms} ms).`
          : 'Subscribed. You will receive incident notifications.';
      } else {
        result.style.color = 'var(--danger)';
        result.textContent = d.error || 'Subscription failed.';
      }
    } catch {
      result.style.color = 'var(--danger)';
      result.textContent = 'Subscription failed.';
    }
  });

  loadStatus();
  setInterval(loadStatus, 30000);
</script>
</body>
</html>
